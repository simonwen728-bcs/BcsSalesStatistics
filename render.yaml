services:
  - type: web
    name: bcs-sales-stats
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --no-browser
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SYNC
        value: "1"
      - key: COST_VIEW_PASSWORD
        sync: false
