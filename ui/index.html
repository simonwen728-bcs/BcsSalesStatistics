  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      display: flex; flex-direction: column; overflow: hidden; height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; color: #1c2733; background: #f4f6f9;
    }
    /* ===== top bar ===== */
    #menubar {
      flex: none; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 12px;
      background: #1f2d3d; color: #e8eefc; user-select: none; position: relative; z-index: 60;
    }
    #menubar .brand { font-weight: 600; font-size: 14px; margin-right: 14px; letter-spacing: .3px; }
    .menu-item { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; position: relative; }
    .menu-item:hover, .menu-item.open { background: #35496e; }
    .menu-spacer { flex: 1; }
    .dropdown {
      display: none; position: absolute; top: 100%; left: 0; min-width: 280px;
      background: #fff; color: #1c2733; border: 1px solid #d7dee8; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 30, 60, .18); padding: 6px; z-index: 100;
    }
    .menu-item.open .dropdown { display: block; }
    .dd-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .dd-item:hover { background: #eef3fb; }
    .dd-sep { height: 1px; background: #e3e9f1; margin: 5px 4px; }
    /* ===== buttons ===== */
    .btn {
      height: 28px; padding: 0 12px; border: 1px solid #c9d4e3; border-radius: 6px;
      background: #fff; color: #1c2733; cursor: pointer; font-size: 12.5px; align-items: center;
    }
    .btn:hover { background: #eef3fb; }
    .btn.primary { background: #2456a6; border-color: #2456a6; color: #fff; }
    .btn.primary:hover { background: #2d69c4; }
    .btn.ghost { background: transparent; border-color: #3d4d68; color: #e8eefc; height: 28px; }
    .btn.ghost:hover { background: #35496e; }
    .btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
    .btn.danger { color: #b3261e; border-color: #e4b5b2; }
    .btn.danger:hover { background: #fbeeec; }
    /* ===== shell: sidebar + main ===== */
    #shell { flex: 1 1 auto; min-height: 0; display: flex; }
    #sidebar {
      flex: none; width: 172px; background: #182230; color: #b9c7db; overflow-y: auto; overflow-x: hidden;
      padding: 8px 0 20px; user-select: none; transition: width .15s ease;
    }
    #sidebar.collapsed { width: 46px; }
    #sidebar.collapsed .nav-group, #sidebar.collapsed .nav-head, #sidebar.collapsed .nav-children, #sidebar.collapsed .nav-cap { display: none; }
    .nav-cap {
      display: flex; align-items: center; gap: 6px; padding: 10px 12px 5px;
      font-size: 11px; letter-spacing: 1px; color: #6c7f9c; user-select: none;
    }
    #sidebar.collapsed .nav-item { padding: 9px 0; text-align: center; font-size: 15px; border-left: none; }
    .nav-toggle {
      display: block; width: 100%; height: 30px; margin-bottom: 4px; border: none;
      background: transparent; color: #6c7f9c; cursor: pointer; font-size: 14px; text-align: center;
    }
    .nav-toggle:hover { background: #223349; color: #e8eefc; }
    .nav-group { padding: 14px 14px 5px; font-size: 11px; letter-spacing: 1px; color: #6c7f9c; }
    .nav-item {
      padding: 8px 14px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-item:hover { background: #223349; color: #e8eefc; }
    .nav-item.active { background: #24406b; color: #fff; border-left-color: #4f8bff; }
    main { flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; }
    .page { display: none; height: 100%; padding: 10px 12px; overflow: auto; flex-direction: column; }
    #page-stats, #page-stat, #page-dashboard { padding: 10px 12px; }
    /* ===== condition card (横向流式：字段一行排开，放不下才换行) ===== */
    .cond-card {
      flex: none; background: #fff; border: 1px solid #dfe6ef; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .cond-title { font-weight: 600; font-size: 13.5px; color: #2c3e57; margin-bottom: 8px; }
    .cond-fields, .cond-body { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    .cond-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #44536a; }
    .cond-row { display: flex; align-items: center; gap: 6px; }
    .cond-fields input, .cond-row input, .cond-fields select, .cond-row select {
      height: 28px; padding: 0 8px; border: 1px solid #c9d4e3; border-radius: 6px; font-size: 12.5px;
    }
    .cond-fields input[type="date"], .cond-row input[type="date"] { width: 140px; }
    .cond-fields input[type="text"], .cond-row input[type="text"], .cond-fields input[type="number"], .cond-row input[type="number"] { width: 140px; }
    .cond-fields .chk, .cond-row .chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
    .cond-actions { display: flex; align-items: center; gap: 8px; }
    .cond-actions .info { color: #5a6b83; font-size: 12px; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .toolbar input[type="text"], .toolbar input[type="search"] {
      height: 28px; width: 200px; padding: 0 10px; border: 1px solid #c9d4e3; border-radius: 6px; font-size: 13px;
    }
    .toolbar .info { color: #5a6b83; font-size: 12px; }
    .pager { display: flex; align-items: center; gap: 6px; margin-left: auto; }
    .pager span { font-size: 12.5px; color: #44536a; }
    /* ===== tables ===== */
    .table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
    table.grid { min-width: 100%; background: #fff; }
    table.grid th, table.grid td {
      border: 1px solid #e2e8f1; padding: 5px 9px; font-size: 12.5px; text-align: left;
      max-width: 420px; min-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    table.grid th { background: #eef3fb; position: sticky; top: 0; z-index: 5; font-weight: 600; }
    table.grid tbody tr:nth-child(even) { background: #fafcfe; }
    table.grid tbody tr:hover { background: #f0f6ff; }
    table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.grid td.empty { text-align: center; color: #8a99b0; padding: 24px 0; }
    .section-title { font-weight: 600; margin: 10px 0 6px; color: #2c3e57; }
    /* ===== stats list pages ===== */
    #page-stat { display: none; }
    .hub-tabs { flex: none; display: flex; gap: 4px; padding: 0 4px; border-bottom: 2px solid #dfe6ef; }
    .hub-tab {
      padding: 8px 20px; cursor: pointer; font-size: 13px; color: #44536a; user-select: none;
      background: transparent; border: 1px solid transparent; border-bottom: none;
      border-radius: 8px 8px 0 0; position: relative; top: 2px;
    }
    .hub-tab:hover { color: #1f4e78; }
    .hub-tab.active { background: #fff; border-color: #dfe6ef; color: #1f4e78; font-weight: 600; }
    .wb-block { flex: none; }
    #univerMount { flex: 1 1 auto; min-height: 0; height: auto; position: relative; background: #fff; border: 1px solid #dfe6ef; border-radius: 8px; overflow: hidden; }
    #univerMount .univer-app, #univerMount > div { height: 100%; }
    .stat-empty { padding: 32px 0; text-align: center; color: #8a99b0; }
    .stat-info { flex: none; white-space: pre-line; font-size: 12.5px; color: #44536a; background: #eef3fb; border: 1px solid #d7dee8; border-radius: 6px; padding: 7px 12px; margin-bottom: 8px; }
    .stat-summary { flex: none; display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 8px; }
    .stat-summary .chip { background: #fff; border: 1px solid #dfe6ef; border-radius: 14px; padding: 3px 12px; font-size: 12px; color: #44536a; }
    .stat-summary .chip b { color: #1f4e78; font-weight: 600; margin-right: 4px; }
    table.stat-list td { font-variant-numeric: tabular-nums; }
    tr.totals td { font-weight: 600; background: #f2f6fb; }
    /* ===== fuzzy query dropdown（模糊查询，输入停止后弹出，最多 20 条） ===== */
    .fuzzy-wrap { position: relative; display: inline-flex; }
    .fuzzy-pop {
      display: none; position: absolute; top: calc(100% + 2px); left: 0; min-width: 280px; max-width: 420px;
      max-height: 262px; overflow-y: auto; background: #fff; border: 1px solid #c9d4e3; border-radius: 6px;
      box-shadow: 0 8px 22px rgba(15, 30, 60, .18); z-index: 150;
    }
    .fuzzy-pop.show { display: block; }
    .fuzzy-item { padding: 6px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fuzzy-item:hover, .fuzzy-item.act { background: #e3edfb; }
    .fuzzy-item .sub { color: #8a99b0; margin-left: 8px; }
    .fuzzy-empty { padding: 8px 10px; color: #8a99b0; font-size: 12px; }
    /* ===== customer trends dashboard（原版排版：左客户列表 / 右上年份+月份双表 / 右下趋势图） =====
       列表与分析各自一张独立 Excel 画布（各一个 Univer 实例），趋势图仍 echarts */
    #page-dashboard { gap: 8px; }
    .dash-cond { flex: none; }
    .dash-cond-group { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
    .dash-grid { flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; }
    .dash-panel {
      display: flex; flex-direction: column; min-width: 0; background: #fff;
      border: 1px solid #dfe6ef; border-radius: 8px; overflow: hidden;
    }
    #dash-left { flex: 0 0 34%; }
    .dash-right-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    #dash-analysis-panel { flex: 0 0 45%; }
    #dash-chart-panel { flex: 1 1 auto; }
    .panel-title { flex: none; padding: 8px 12px; font-weight: 600; font-size: 12.5px; background: #eef3fb; color: #2c3e57; }
    .dash-head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .dash-range { display: flex; align-items: center; font-weight: 400; font-size: 12px; color: #44536a; }
    .dash-cust { font-weight: 600; color: #1f4e78; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dash-mount-box { flex: 1 1 auto; min-height: 0; position: relative; }
    .dash-mount-box > div { position: absolute; inset: 0; background: #fff; }
    .dash-mount-box .univer-app, .dash-mount-box > div > div { height: 100%; }
    /* 面板内隐藏公式栏/页签栏；工具栏保留（用户要能在面板里设置单元格样式） */
    #dashListMount .univer-formula-box, #dashListMount .univer-sheet-bar,
    #dashAnaMount .univer-formula-box, #dashAnaMount .univer-sheet-bar { display: none !important; }
    #dash-chart { flex: 1 1 auto; min-height: 0; }
    .seg { display: flex; gap: 4px; }
    /* ===== modal & toast ===== */
    .modal-wrap {
      position: fixed; inset: 0; background: rgba(20, 30, 50, .45); z-index: 200;
      display: flex; align-items: flex-start; justify-content: center; padding-top: 90px;
    }
    .modal {
      width: 560px; max-width: 92vw; max-height: 76vh; overflow: auto; background: #fff; border-radius: 10px;
      box-shadow: 0 18px 48px rgba(10, 25, 60, .3);
    }
    .modal-title {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
      font-weight: 600; font-size: 14px; border-bottom: 1px solid #eef1f6;
    }
    .modal-x { border: none; background: none; font-size: 18px; cursor: pointer; color: #7a8aa2; }
    .modal-body { padding: 14px 16px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid #eef1f6; }
    .confirm-text { font-size: 13.5px; line-height: 1.6; padding: 4px 2px; }
    .form .form-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .form .form-row > span { width: 150px; flex: none; color: #44536a; font-size: 12.5px; }
    .form .form-row input, .form .form-row select {
      flex: 1; height: 30px; padding: 0 9px; border: 1px solid #c9d4e3; border-radius: 6px; font-size: 13px; min-width: 0;
    }
    .form .form-row.full { width: 100%; }
    .form .form-row .chk { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
    /* ===== loading 反馈 ===== */
    .loadbar { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: #4f8bff; z-index: 400; opacity: 0; transition: width .25s ease, opacity .3s ease; pointer-events: none; }
    .loadbar.on { opacity: 1; width: 82%; }
    .loadbar.done { opacity: 0; width: 100%; }
    .loading-overlay {
      position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center; background: rgba(255, 255, 255, .72);
    }
    .loading-overlay .spin { width: 30px; height: 30px; border: 3px solid #d7e3f6; border-top-color: #2456a6; border-radius: 50%; animation: spin .8s linear infinite; }
    .loading-overlay .txt { font-size: 12.5px; color: #44536a; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast {
      position: fixed; right: 18px; bottom: 18px; background: #22334d; color: #fff; padding: 10px 16px;
      border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all .25s; z-index: 300;
      pointer-events: none; max-width: 60vw;
    }
    #toast.show { opacity: 1; transform: none; }
    #status {
      position: fixed; left: 10px; bottom: 6px; font-size: 11px; color: #93a2b8; z-index: 50; pointer-events: none;
    }
  </style>
</head>

  <div id="menubar"></div>
  <div id="shell">
    <nav id="sidebar"></nav>
    <main>
      <section class="page" id="page-sheet">
        <div id="wb-sales" class="wb-block" style="display:none">
        <div class="toolbar">
          <button class="btn primary" id="sales-import" data-i18n="importSales"></button>
          <button class="btn" id="sales-sync" data-i18n="syncSales"></button>
          <button class="btn" id="sales-delmonth" data-i18n="delByMonth"></button>
          <button class="btn sm" id="sales-edit" data-i18n="edit" disabled></button>
          <span class="info" id="sales-info"></span>
          <div class="pager">
            <button class="btn sm" id="sales-prev">‹</button>
            <span id="sales-page"></span>
            <button class="btn sm" id="sales-next">›</button>
            <select id="sales-pagesize" class="sel" title="rows/page"></select>
          </div>
        </div>
        <div class="cond-card">
          <div class="cond-fields">
            <label class="cond-item"><span data-i18n="fltDate"></span>:</label>
            <input type="date" id="f-start" />
            <span>–</span>
            <input type="date" id="f-end" />
            <span class="qbtns">
              <button class="btn sm" id="q-lastyear" data-i18n="quickLY"></button>
              <button class="btn sm" id="q-thisyear" data-i18n="quickTY"></button>
              <button class="btn sm" id="q-ttm" data-i18n="quickTTM"></button>
              <select id="f-year" class="sel"></select>
            </span>
            <label class="cond-item"><span data-i18n="custName"></span>:</label>
            <input type="text" id="f-custname" autocomplete="off" />
            <label class="cond-item"><span data-i18n="colItemNo"></span>:</label>
            <input type="text" id="f-itemno" autocomplete="off" />
            <label class="cond-item"><span data-i18n="colDesc"></span>:</label>
            <input type="text" id="f-desc" autocomplete="off" />
            <label class="cond-item"><span data-i18n="colType"></span>:</label>
            <input type="text" id="f-type" autocomplete="off" />
            <label class="cond-item"><span data-i18n="colColor"></span>:</label>
            <input type="text" id="f-color" autocomplete="off" />
            <label class="cond-item"><span data-i18n="colInvoice"></span>:</label>
            <input type="text" id="f-inv" autocomplete="off" />
            <label class="cond-item"><span data-i18n="colRep1"></span>:</label>
            <input type="text" id="f-rep1" autocomplete="off" />
            <button class="btn primary" id="sales-query" data-i18n="btnQuery"></button>
            <button class="btn" id="sales-reset" data-i18n="btnReset"></button>
          </div>
        </div>
      </div>
        <div id="wb-customers" class="wb-block" style="display:none">
        <div class="toolbar">
          <input type="search" id="cust-search" data-i18n-ph="search" />
          <button class="btn primary" id="cust-add" data-i18n="add"></button>
          <button class="btn" id="cust-sync" data-i18n="syncCustomers"></button>
